# Quick Start Automation
# Copy this to test your setup - it uses persistent notifications that work out of the box

# This automation will show a notification in your Home Assistant UI
# No phone app or additional setup required!

- alias: "Train Monitor - Quick Start Test"
  description: "Simple test automation to verify train monitoring is working"
  trigger:
    # Listen for the train_status event
    - platform: event
      event_type: train_status
  action:
    # Choose action based on the status field in the event data
    - choose:
        # If train is cancelled
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.status == 'cancelled' }}"
          sequence:
            - service: notify.persistent_notification
              data:
                title: "❌ Train Cancelled"
                message: "Your train has been cancelled. Reason code: {{ trigger.event.data.reason_code }}"
        
        # If train is delayed
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.status == 'delayed' }}"
          sequence:
            - service: notify.persistent_notification
              data:
                title: "⚠️ Train Delayed"
                message: "Train is delayed by {{ trigger.event.data.minutes_delayed }} minutes (scheduled: {{ trigger.event.data.scheduled_time }}, actual: {{ trigger.event.data.actual_time }})"
        
        # If train is on time
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.status == 'on_time' }}"
          sequence:
            - service: notify.persistent_notification
              data:
                title: "✅ Train On Time"
                message: "Your train is running on schedule (arrival: {{ trigger.event.data.scheduled_time }})"
        
        # If train is early
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.status == 'early' }}"
          sequence:
            - service: notify.persistent_notification
              data:
                title: "🚀 Train Early"
                message: "Train is early by {{ trigger.event.data.minutes_early }} minutes (scheduled: {{ trigger.event.data.scheduled_time }}, actual: {{ trigger.event.data.actual_time }})"
  mode: single


# INSTALLATION INSTRUCTIONS:
# 
# Method 1 - Using the UI (Easiest):
# 1. Settings → Automations & Scenes
# 2. Click the three dots menu (top right) → "Edit in YAML"
# 3. Paste this entire file
# 4. Save
#
# Method 2 - Using automations.yaml:
# 1. Open your automations.yaml file
# 2. Paste this automation at the end
# 3. Developer Tools → YAML → Reload Automations
#
# TESTING:
# To test without waiting for real train data:
# 1. Developer Tools → Events
# 2. Event type: train_status
# 3. Event data examples:
#
#    Delayed train:
#    {"status": "delayed", "depart_station": "HYR", "arrive_station": "BFR", "scheduled_time": "17:40", "actual_time": "17:50", "minutes_difference": 10, "minutes_delayed": 10}
#
#    On time train:
#    {"status": "on_time", "depart_station": "HYR", "arrive_station": "BFR", "scheduled_time": "17:40", "actual_time": "17:40", "minutes_difference": 0}
#
#    Early train:
#    {"status": "early", "depart_station": "HYR", "arrive_station": "BFR", "scheduled_time": "17:40", "actual_time": "17:35", "minutes_difference": -5, "minutes_early": 5}
#
#    Cancelled train:
#    {"status": "cancelled", "depart_station": "HYR", "arrive_station": "BFR", "reason_code": "123"}
#
# 4. Click "FIRE EVENT"
# 5. You should see a notification appear in Home Assistant!
#
# WHERE TO SEE NOTIFICATIONS:
# - Click the notification bell icon (top right of Home Assistant)
# - Or check: Settings → System → Logs
